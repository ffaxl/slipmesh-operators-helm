name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint .

      - name: helm lint (example values)
        run: helm lint . -f .ci/example-values.yaml

      - name: helm template
        run: helm template slipmesh . -n slipmesh -f .ci/example-values.yaml > /tmp/rendered.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: install validator deps
        run: pip install pyyaml jsonschema

      # helm lint/template only check YAML syntax and Go-template correctness, not whether the
      # rendered custom resources actually satisfy this chart's own CRD schemas (format: cidr,
      # maxLength, required fields, etc.) - see .ci/validate-crs.py's own doc comment.
      - name: validate rendered custom resources against crds/
        run: python3 .ci/validate-crs.py < /tmp/rendered.yaml

  # Separate job (not folded into `check`) so a secret hit is unambiguous in the PR checks list,
  # rather than buried in the same log as an unrelated lint/validation failure.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full commit history by default, not just the working tree - a
          # shallow checkout would only let it see the single most recent commit. Relevant here
          # specifically because real deployment data (node IPs, ASN lists, road-warrior keys)
          # is meant to live only in the gitignored .values.yaml - this catches an accidental
          # commit of that file, past or present.
          fetch-depth: 0

      # Free for personal-account repos (gitleaks' commercial license only applies to GitHub
      # Organizations) - see https://github.com/gitleaks/gitleaks-action for the org case.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
