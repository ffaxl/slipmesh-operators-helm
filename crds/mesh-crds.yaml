apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: meshlinks.slipmesh.net
spec:
  group: slipmesh.net
  names:
    kind: MeshLink
    plural: meshlinks
    shortNames:
    - mlink
    singular: meshlink
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeA
      name: NodeA
      type: string
    - jsonPath: .spec.nodeB
      name: NodeB
      type: string
    - jsonPath: .status.network
      name: Network
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MeshLinkSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A single mesh tunnel between two `MeshNode`s. Its `/31` and port are drawn from a `MeshPool`
              (`status.network`/`status.port`); `spec.network` is an escape hatch to pin an existing subnet.
            properties:
              network:
                description: |-
                  Escape hatch: pin this link to a specific `/31` (e.g. `"10.200.100.0/31"`) instead of
                  drawing one from a `MeshPool`. Must fall inside some `MeshPool`'s range - the port is
                  still derived from its position there.
                format: cidr
                nullable: true
                type: string
              nodeA:
                description: |-
                  MeshNode name of one end. `node_a` always takes the lower `/31` address and drives pool
                  allocation (see `is_lower`) - field order now matters, unlike an unordered pair. This
                  matters specifically for pinning an external, never-Kubernetes `MeshNode` (e.g. an office
                  router) as `node_b`: no pod will ever run under its name, so it must never be elected to
                  drive allocation the way an alphabetical tie-break could pick it by accident.
                type: string
              nodeB:
                type: string
              obfuscation:
                properties:
                  h1:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  h2:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  h3:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  h4:
                    format: int64
                    maximum: 4294967295.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  jc:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  jmax:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  jmin:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  s1:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                  s2:
                    format: int32
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
            required:
            - nodeA
            - nodeB
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              network:
                format: cidr
                nullable: true
                type: string
              pool:
                description: |-
                  Which `MeshPool` `network`/`port` were drawn from - `None` if `spec.network` was pinned
                  outside every configured pool's range.
                nullable: true
                type: string
              port:
                format: int32
                maximum: 65535.0
                minimum: 0.0
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: MeshLink
        type: object
    served: true
    storage: true
    subresources:
      status: {}

