apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: meshpools.slipmesh.net
spec:
  group: slipmesh.net
  names:
    kind: MeshPool
    plural: meshpools
    shortNames:
    - mpool
    singular: meshpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.network
      name: Network
      type: string
    - jsonPath: .spec.basePort
      name: BasePort
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for MeshPoolSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A pool of `/31` subnets (and, from each one's position, a port) that `MeshLink`s draw from.
              Namespaced; multiple instances are meaningful, e.g. to add a second range once the first
              fills up without touching already-allocated links.
            properties:
              basePort:
                description: |-
                  Port for the `/31` at `network` itself; each subsequent `/31` gets the next port (see
                  `mesh_math::addressing_for`).
                format: int32
                maximum: 65535.0
                minimum: 0.0
                type: integer
              network:
                description: |-
                  CIDR of this pool's address range, e.g. `"172.20.255.0/24"`. `format: cidr` validates
                  syntax only - it doesn't check that `network` is the aligned base address of its own
                  range, so that's checked in Rust (see `common::netlink::rt::parse_network_cidr`); an
                  invalid pool is skipped with a warning, not a hard error.
                format: cidr
                type: string
            required:
            - basePort
            - network
            type: object
          status:
            nullable: true
            properties:
              allocated:
                default: []
                items:
                  properties:
                    owner:
                      type: string
                    port:
                      description: |-
                        Carried alongside `value` at allocation time, never recomputed later - an already-
                        allocated owner keeps whatever port it was given even if the pool's own parameters
                        (e.g. `MeshPoolSpec.basePort`) are edited afterward. `None` for callers with no such
                        concept (`RouterPool`'s loopback addresses).
                      format: int32
                      maximum: 65535.0
                      minimum: 0.0
                      nullable: true
                      type: integer
                    value:
                      type: string
                  required:
                  - owner
                  - value
                  type: object
                type: array
            type: object
        required:
        - spec
        title: MeshPool
        type: object
    served: true
    storage: true
    subresources:
      status: {}

