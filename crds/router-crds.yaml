apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routernodes.slipmesh.net
spec:
  group: slipmesh.net
  names:
    kind: RouterNode
    plural: routernodes
    shortNames:
    - rnode
    singular: routernode
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for RouterNodeSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Router identity for one node: its OSPF/BGP loopback address (`router-lo` dummy interface).
              `metadata.name` must equal the Kubernetes Node name, same convention as MeshNode. The loopback
              address is drawn from a `RouterPool` (`status.loopback`); `spec.loopback` is an escape hatch
              to pin an existing address.
            properties:
              loopback:
                description: |-
                  Escape hatch: pin this node to a specific loopback address instead of drawing one from a
                  `RouterPool`. Must fall inside some `RouterPool`'s configured range.
                format: ipv4
                nullable: true
                type: string
              routerLabel:
                description: |-
                  Short, router-facing identity used to build the `ibgp_<router_label>` BIRD protocol name
                  on every peer, independent of the Kubernetes Node name. Must be unique across all
                  RouterNodes (checked at reconcile time).
                maxLength: 10
                minLength: 1
                pattern: ^[a-zA-Z0-9_-]+$
                type: string
            required:
            - routerLabel
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              loopback:
                format: ipv4
                nullable: true
                type: string
              pool:
                description: |-
                  Which `RouterPool` `loopback` was drawn from - `None` if `spec.loopback` was pinned
                  outside every configured pool's range.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: RouterNode
        type: object
    served: true
    storage: true
    subresources:
      status: {}

