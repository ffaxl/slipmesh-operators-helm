apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh
  namespace: {{ include "slipmesh.namespace" . }}
---
# MeshNode/MeshLink are namespaced purely so access can be granted with an ordinary
# namespace-scoped Role instead of a cluster-wide ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh
  namespace: {{ include "slipmesh.namespace" . }}
# Minimal rules below are generated verbatim from mesh's own API calls (mesh-rbacgen) -
# regenerate and re-sync here if the operator's code changes what it reads/writes.
rules:
  - apiGroups: ["slipmesh.net"]
    resources: ["meshnodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["slipmesh.net"]
    resources: ["meshnodes/status"]
    verbs: ["patch"]
  - apiGroups: ["slipmesh.net"]
    resources: ["meshlinks"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["slipmesh.net"]
    resources: ["meshlinks/status"]
    verbs: ["patch"]
  # MeshPool: allocates/releases /31+port slots for MeshLink.
  - apiGroups: ["slipmesh.net"]
    resources: ["meshpools"]
    verbs: ["list", "get"]
  - apiGroups: ["slipmesh.net"]
    resources: ["meshpools/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh
  namespace: {{ include "slipmesh.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: mesh
    namespace: {{ include "slipmesh.namespace" . }}
roleRef:
  kind: Role
  name: mesh
  apiGroup: rbac.authorization.k8s.io
---
# Each node's own AmneziaWG private key lives here, readable/writable by every mesh pod (all
# run under the same ServiceAccount and already have hostNetwork+privileged node-level access
# anyway). create/patch: a node with no existing entry generates and persists its own private
# key on first boot. `resourceNames` can't scope `create` (the object doesn't exist yet at
# authorization time), so that verb is necessarily unscoped; get/patch against an
# already-existing Secret are scoped to mesh-keys specifically, so mesh can't touch e.g.
# roadwarriors' own key.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mesh-secrets
  namespace: {{ include "slipmesh.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mesh-keys"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mesh-secrets
  namespace: {{ include "slipmesh.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: mesh
    namespace: {{ include "slipmesh.namespace" . }}
roleRef:
  kind: Role
  name: mesh-secrets
  apiGroup: rbac.authorization.k8s.io
