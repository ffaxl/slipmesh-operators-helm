apiVersion: v1
kind: ServiceAccount
metadata:
  name: roadwarriors
  namespace: {{ include "slipmesh.namespace" . }}
---
# RoadWarrior is namespaced purely so access can be granted with an ordinary
# namespace-scoped Role instead of a cluster-wide ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roadwarriors
  namespace: {{ include "slipmesh.namespace" . }}
# Generated verbatim from roadwarriors' own API calls (roadwarriors-rbacgen) - regenerate and
# re-sync here if the operator's code changes what it reads/writes.
rules:
  - apiGroups: ["slipmesh.net"]
    resources: ["roadwarriors"]
    verbs: ["list", "watch"]
  - apiGroups: ["slipmesh.net"]
    resources: ["roadwarriors/status"]
    verbs: ["patch"]
---
# Shared server identity (one Secret, same key on every roadwarriors pod - unlike mesh's
# per-node keys): a pod with no existing entry generates and persists one on first boot.
# patch: same get_or_create_secret_key helper mesh uses - a create-race loser (409) whose
# winner didn't happen to write the field falls through to a merge-patch, not just a re-read.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roadwarriors-secrets
  namespace: {{ include "slipmesh.namespace" . }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roadwarriors-secrets
  namespace: {{ include "slipmesh.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: roadwarriors
    namespace: {{ include "slipmesh.namespace" . }}
roleRef:
  kind: Role
  name: roadwarriors-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roadwarriors
  namespace: {{ include "slipmesh.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: roadwarriors
    namespace: {{ include "slipmesh.namespace" . }}
roleRef:
  kind: Role
  name: roadwarriors
  apiGroup: rbac.authorization.k8s.io
