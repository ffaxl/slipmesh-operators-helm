apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: router
  namespace: {{ include "slipmesh.namespace" . }}
  labels:
    {{- include "slipmesh.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
        {{- include "slipmesh.labels" . | nindent 8 }}
    spec:
      serviceAccountName: router
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: router
          image: {{ .Values.image.router }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              drop: ["ALL"]
              # NET_RAW: bird's OSPF speaks over a raw IP socket (protocol 89), not TCP/UDP.
              # NET_BIND_SERVICE: bird's iBGP listens on TCP/179, a privileged (<1024) port.
              add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: {{ .Values.logLevel.router | quote }}
          resources:
            {{- toYaml .Values.resources.router | nindent 12 }}
          volumeMounts:
            - name: cni-net-d
              mountPath: /etc/cni/net.d
      volumes:
        - name: cni-net-d
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
